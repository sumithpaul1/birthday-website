<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Akka</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer" />

    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous"></script>
</head>

<body>

    <div id="wrapper">

        <!-- Birthday Flags -->

        <div class="flag__birthday">

            <img src="./images/1.png"
                alt=""
                width="350"
                class="flag__left">

            <img src="./images/1.png"
                alt=""
                width="350"
                class="flag__right">

        </div>


        <!-- Main Content -->

        <div class="content">

            <!-- LEFT SIDE -->

            <div class="left">

                <div class="title">

                    <!-- HAPPY -->

                    <h1 class="happy">

                        <span style="--t: 4s;">H</span>
                        <span style="--t: 4.2s;">a</span>
                        <span style="--t: 4.4s;">p</span>
                        <span style="--t: 4.6s;">p</span>
                        <span style="--t: 4.8s;">y</span>

                    </h1>


                    <!-- BIRTHDAY AKKA -->

                    <h1 class="birthday">

                        <span style="--t: 5s;">B</span>
                        <span style="--t: 5.2s;">i</span>
                        <span style="--t: 5.4s;">r</span>
                        <span style="--t: 5.6s;">t</span>
                        <span style="--t: 5.8s;">h</span>
                        <span style="--t: 6s;">d</span>
                        <span style="--t: 6.2s;">a</span>
                        <span style="--t: 6.4s;">y</span>

                        <span style="--t: 6.6s;">&nbsp;</span>

                        <span style="--t: 6.8s;">A</span>
                        <span style="--t: 7s;">k</span>
                        <span style="--t: 7.2s;">k</span>
                        <span style="--t: 7.4s;">a</span>

                    </h1>


                    <!-- Birthday Hat -->

                    <div class="hat">

                        <img src="./images/hat.png"
                            alt=""
                            width="130">

                    </div>

                </div>


                <!-- Date -->

                <div class="date__of__birth">

                    <span></span>

                </div>


                <!-- BUTTON -->

                <div class="btn">

                    <button id="btn__letter"
                        onclick="window.location.href='memories.html'">

                        <div class="mail">

                            IDHAR UNGLI LAGA RE

                            <i class="fa-regular fa-envelope"></i>

                        </div>

                    </button>

                </div>

            </div>


            <!-- RIGHT SIDE -->

            <div class="right">

                <div class="box__account">

                    <!-- Photo -->

                    <div class="image">

                        <img src="./images/akka.jpg"
                            alt="">

                    </div>


                    <!-- Name -->

                    <div class="name">

                        <i class="fa-solid fa-heart"></i>

                        <span>MAJOR 1</span>

                        <i class="fa-solid fa-heart"></i>

                    </div>


                    <!-- Balloons -->

                    <div class="balloon_one">

                        <img width="100px"
                            src="./images/balloon1.png"
                            alt="">

                    </div>


                    <div class="balloon_two">

                        <img width="100px"
                            src="./images/balloon2.png"
                            alt="">

                    </div>

                </div>


                <!-- Circle -->

                <div class="cricle">

                    <div class="text__cricle">

                        <span style="--i: 1;">h</span>
                        <span style="--i: 2;">a</span>
                        <span style="--i: 3;">p</span>
                        <span style="--i: 4;">p</span>
                        <span style="--i: 5;">y</span>
                        <span style="--i: 6;">-</span>
                        <span style="--i: 7;">b</span>
                        <span style="--i: 8;">i</span>
                        <span style="--i: 9;">r</span>
                        <span style="--i: 10;">t</span>
                        <span style="--i: 11;">h</span>
                        <span style="--i: 12;">d</span>
                        <span style="--i: 13;">a</span>
                        <span style="--i: 14;">y</span>
                        <span style="--i: 15;">-</span>

                    </div>

                    <i class="fa-solid fa-heart"></i>

                </div>

            </div>

        </div>


        <!-- Stars -->

        <div class="decorate_star star1"
            style="--t: 15s;"></div>

        <div class="decorate_star star2"
            style="--t: 15.2s;"></div>

        <div class="decorate_star star3"
            style="--t: 15.4s;"></div>

        <div class="decorate_star star4"
            style="--t: 15.6s;"></div>

        <div class="decorate_star star5"
            style="--t: 15.8s;"></div>


        <!-- Flowers -->

        <div class="decorate_flower--one"
            style="--t: 15s;">

            <img width="20"
                src="./images/decorate_flower.png"
                alt="">

        </div>


        <div class="decorate_flower--two"
            style="--t: 15.3s;">

            <img width="20"
                src="./images/decorate_flower.png"
                alt="">

        </div>


        <div class="decorate_flower--three"
            style="--t: 15.6s;">

            <img width="20"
                src="./images/decorate_flower.png"
                alt="">

        </div>


        <!-- Bottom Decoration -->

        <div class="decorate_bottom">

            <img src="./images/decorate.png"
                alt=""
                width="100">

        </div>


        <!-- Smiley -->

        <div class="smiley__icon">

            <img src="./images/smiley_icon.png"
                alt=""
                width="100">

        </div>

    </div>


    <!-- Date Animation -->

    <script>

        let datetxt = "30 SEP";

        let charArrDate = datetxt.split('');

        let currentIndex = 0;

        let date__of__birth =
            document.querySelector(".date__of__birth span");


        setTimeout(function () {

            let timeDatetxt = setInterval(function () {

                if (currentIndex < charArrDate.length) {

                    date__of__birth.textContent +=
                        charArrDate[currentIndex];

                    currentIndex++;

                }

                else {

                    let i =
                        document.createElement("i");

                    i.className =
                        "fa-solid fa-star";

                    document
                        .querySelector(".date__of__birth")
                        .prepend(i);

                    document
                        .querySelector(".date__of__birth")
                        .appendChild(i.cloneNode(true));

                    clearInterval(timeDatetxt);

                }

            }, 100);

        }, 12000);

    </script>

</body>

</html>
